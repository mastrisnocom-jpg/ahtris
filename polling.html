<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Polling Sederhana</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .poll-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            color: #333;
            font-size: 1.4rem;
            margin-bottom: 8px;
            text-align: center;
        }

        p.subtitle {
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 24px;
        }

        .poll-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 14px 16px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
            text-align: left;
        }

        .option-btn:hover {
            border-color: #4a90e2;
            background: #f0f7ff;
        }

        /* Progress Bar di Belakang Teks */
        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: #e2eeff;
            z-index: 1;
            transition: width 0.4s ease;
        }

        .option-content {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #444;
        }

        .percentage {
            font-size: 0.85rem;
            color: #4a90e2;
            display: none; /* Disembunyikan sebelum memilih */
        }

        .total-votes {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #888;
        }

        .disabled {
            pointer-events: none;
        }

        .selected {
            border-color: #4a90e2 !important;
            background-color: #f0f7ff;
        }
    </style>
</head>
<body>

<div class="poll-card">
    <h2>Apa bahasa pemrograman favoritmu?</h2>
    <p class="subtitle">Pilih salah satu opsi di bawah ini</p>

    <div class="poll-options" id="pollOptions">
        <button class="option-btn" onclick="vote(0)">
            <div class="progress-bar" id="bar-0"></div>
            <div class="option-content">
                <span>JavaScript</span>
                <span class="percentage" id="percent-0">0%</span>
            </div>
        </button>

        <button class="option-btn" onclick="vote(1)">
            <div class="progress-bar" id="bar-1"></div>
            <div class="option-content">
                <span>Python</span>
                <span class="percentage" id="percent-1">0%</span>
            </div>
        </button>

        <button class="option-btn" onclick="vote(2)">
            <div class="progress-bar" id="bar-2"></div>
            <div class="option-content">
                <span>PHP</span>
                <span class="percentage" id="percent-2">0%</span>
            </div>
        </button>

        <button class="option-btn" onclick="vote(3)">
            <div class="progress-bar" id="bar-3"></div>
            <div class="option-content">
                <span>Java</span>
                <span class="percentage" id="percent-3">0%</span>
            </div>
        </button>
    </div>

    <div class="total-votes" id="totalVotes">Total Suara: 0</div>
</div>

<script>
    // Data jumlah suara awal
    let votes = [0, 0, 0, 0];
    let hasVoted = false;

    function vote(index) {
        if (hasVoted) return; // Mencegah pemungutan suara ganda

        // Tambah suara pada opsi yang dipilih
        votes[index]++;
        hasVoted = true;

        const total = votes.reduce((a, b) => a + b, 0);

        // Update tampilan untuk setiap opsi
        votes.forEach((voteCount, i) => {
            const percentage = Math.round((voteCount / total) * 100);
            
            // Atur lebar progress bar
            document.getElementById(`bar-${i}`).style.width = percentage + '%';
            
            // Tampilkan angka persentase
            const percentText = document.getElementById(`percent-${i}`);
            percentText.innerText = percentage + '%';
            percentText.style.display = 'inline';

            // Nonaktifkan tombol setelah memilih
            const btn = document.querySelectorAll('.option-btn')[i];
            btn.classList.add('disabled');
            
            if (i === index) {
                btn.classList.add('selected');
            }
        });

        // Update total suara
        document.getElementById('totalVotes').innerText = `Total Suara: ${total}`;
    }
</script>

</body>
</html>
