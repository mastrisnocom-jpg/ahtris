<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHTRIS.MY.ID - Shortlink & Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- 1. IKLAN TOP FRAME (DI ATAS WEBSITE ASLI) -->
    <div id="topFrameAdBar" class="w-full bg-slate-900 border-b border-emerald-900/50 p-3 text-center hidden z-50 sticky top-0 shadow-lg">
        <div id="topFrameAdContent" class="max-w-4xl mx-auto overflow-hidden"></div>
    </div>

    <!-- CONTAINER WEBSITE ASLI DALAM IFRAME (MODES TOP FRAME) -->
    <iframe id="websiteIframe" class="w-full flex-1 border-none hidden" style="height: calc(100vh - 80px);"></iframe>

    <!-- 2. MAIN CONTAINER INTERSTITIAL AD (HALAMAN JEDA 5 DETIK) -->
    <div id="interstitialContainer" class="w-full max-w-md mx-auto p-6 text-center my-auto hidden">
        <div class="bg-slate-900 border border-emerald-900/50 rounded-2xl p-6 shadow-2xl relative">
            <h2 class="text-xl font-bold text-white mb-1">Mengarahkan ke Tautan...</h2>
            <p class="text-xs text-slate-400 mb-4">Mohon tunggu sebentar sebelum menuju lokasi tujuan.</p>

            <!-- SLOT IKLAN INTERSTITIAL JEDA -->
            <div id="interstitialAdSlot" class="my-4 p-3 bg-slate-950 rounded-xl border border-slate-800 min-h-[150px] flex items-center justify-center overflow-hidden"></div>

            <div class="mt-4">
                <button id="btnSkipAd" disabled class="w-full py-3 bg-emerald-600 opacity-50 text-white font-bold rounded-xl text-xs transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-spinner fa-spin"></i> Tunggu <span id="adCountdown">5</span> Detik...
                </button>
            </div>
        </div>
    </div>

    <!-- MICROSITE PUBLIK -->
    <div id="micrositeContainer" class="w-full max-w-sm text-center my-auto p-4 hidden">
        <div class="w-28 h-28 rounded-full mx-auto mb-4 overflow-hidden border-2 border-emerald-500 shadow-lg flex items-center justify-center bg-emerald-500 text-white shrink-0">
            <img id="userAvatar" src="" class="w-full h-full object-cover hidden">
            <i id="userAvatarIcon" class="fa-solid fa-user text-4xl"></i>
        </div>
        <h1 id="userName" class="text-2xl font-black text-white tracking-wide uppercase">--</h1>
        <p id="userBio" class="text-xs text-slate-400 font-semibold tracking-widest uppercase mt-1 mb-8">--</p>
        <div id="userLinks" class="space-y-3.5 w-full"></div>
    </div>

    <!-- LOADING STATE -->
    <div id="loadingState" class="my-auto text-center text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-emerald-500 mb-2"></i>
        <p class="text-xs font-semibold">Memuat Tautan...</p>
    </div>

    <!-- SCRIPT UTAMA PERBAIKAN ESEKUSI IKLAN -->
    <script>
        const SUPABASE_URL = "https://lcpskriooezyxgrnarol.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_puy9U_93p-7_Q64oHrYUpg_iEF3nJ-c";

        function getHeaders() {
            return {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json'
            };
        }

        // --- FUNGSI KHUSUS UNTUK MENJALANKAN SCRIPT IKLAN DENGAN AMAN ---
        function setAndExecuteAdCode(elementId, htmlCode) {
            const container = document.getElementById(elementId);
            if (!container || !htmlCode) return;

            container.innerHTML = htmlCode;

            // Cari semua tag <script> di dalam kode iklan dan eksekusi ulang
            const scripts = container.querySelectorAll("script");
            scripts.forEach((oldScript) => {
                const newScript = document.createElement("script");
                Array.from(oldScript.attributes).forEach((attr) => {
                    newScript.setAttribute(attr.name, attr.value);
                });
                newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                oldScript.parentNode.replaceChild(newScript, oldScript);
            });
        }

        async function initDynamicRouter() {
            const pathSlug = window.location.pathname.replace(/^\/|\/$/g, '');

            if (!pathSlug || pathSlug === 'index.html' || pathSlug === 'microsite.html') {
                window.location.replace('/');
                return;
            }

            try {
                // 1. Ambil Pengaturan Iklan
                const resAds = await fetch(`${SUPABASE_URL}/rest/v1/ad_settings?id=eq.default_ads&select=*`, { headers: getHeaders() });
                const adsData = await resAds.json();
                const ads = (adsData && adsData.length > 0) ? adsData[0] : {};

                // 2. CEK MICROSITE
                const resProf = await fetch(`${SUPABASE_URL}/rest/v1/microsite_profiles?slug=eq.${encodeURIComponent(pathSlug)}&select=*`, { headers: getHeaders() });
                const profData = await resProf.json();

                if (profData && profData.length > 0) {
                    const prof = profData[0];
                    document.getElementById('userName').textContent = prof.display_name;
                    document.getElementById('userBio').textContent = prof.bio;

                    if (prof.avatar_url) {
                        document.getElementById('userAvatar').src = prof.avatar_url;
                        document.getElementById('userAvatar').classList.remove('hidden');
                        document.getElementById('userAvatarIcon').classList.add('hidden');
                    }

                    const resLinks = await fetch(`${SUPABASE_URL}/rest/v1/microsite_links?profile_id=eq.${prof.id}&select=*&order=sort_order.asc`, { headers: getHeaders() });
                    const linksData = await resLinks.json();

                    const linksContainer = document.getElementById('userLinks');
                    linksContainer.innerHTML = '';
                    linksData.forEach(item => {
                        linksContainer.innerHTML += `
                            <a href="${item.url}" target="_blank" class="w-full py-3.5 px-5 bg-slate-900 hover:bg-slate-800 rounded-2xl text-sm font-bold text-white transition flex items-center justify-between border border-slate-800 shadow-sm">
                                <span class="truncate px-2 font-bold">${item.title}</span>
                                <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                            </a>
                        `;
                    });

                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('micrositeContainer').classList.remove('hidden');
                    return;
                }

                // 3. CEK SHORTLINK URL (SISTEM IKLAN INTERSTITIAL & TOP FRAME)
                const resUrl = await fetch(`${SUPABASE_URL}/rest/v1/urls?slug=eq.${encodeURIComponent(pathSlug)}&select=original_url`, { headers: getHeaders() });
                const urlData = await resUrl.json();

                if (urlData && urlData.length > 0 && urlData[0].original_url) {
                    const targetUrl = urlData[0].original_url;

                    // A. JIKA ADA IKLAN INTERSTITIAL (JEDA 5 DETIK)
                    if (ads.ad_interstitial && ads.ad_interstitial.trim() !== '') {
                        document.getElementById('loadingState').classList.add('hidden');
                        
                        // Eksekusi skrip iklan Interstitial
                        setAndExecuteAdCode('interstitialAdSlot', ads.ad_interstitial);
                        document.getElementById('interstitialContainer').classList.remove('hidden');

                        let timeLeft = 5;
                        const btnSkip = document.getElementById('btnSkipAd');
                        const countdownSpan = document.getElementById('adCountdown');

                        const timer = setInterval(() => {
                            timeLeft--;
                            countdownSpan.textContent = timeLeft;

                            if (timeLeft <= 0) {
                                clearInterval(timer);
                                btnSkip.disabled = false;
                                btnSkip.classList.remove('opacity-50');
                                btnSkip.innerHTML = `<i class="fa-solid fa-arrow-right font-bold"></i> Lanjutkan ke Tautan Asli`;

                                btnSkip.onclick = function() {
                                    // B. JIKA JUGA ADA IKLAN TOP FRAME
                                    if (ads.ad_top_frame && ads.ad_top_frame.trim() !== '') {
                                        showTopFramePage(targetUrl, ads.ad_top_frame);
                                    } else {
                                        window.location.href = targetUrl;
                                    }
                                };
                            }
                        }, 1000);

                    // C. JIKA HANYA ADA IKLAN TOP FRAME (TANPA INTERSTITIAL)
                    } else if (ads.ad_top_frame && ads.ad_top_frame.trim() !== '') {
                        document.getElementById('loadingState').classList.add('hidden');
                        showTopFramePage(targetUrl, ads.ad_top_frame);

                    // D. JIKA TANPA IKLAN SAMA SEKALI -> DIRECT REDIRECT
                    } else {
                        window.location.replace(targetUrl);
                    }
                    return;
                }

                window.location.replace('/');
            } catch (err) {
                window.location.replace('/');
            }
        }

        function showTopFramePage(targetUrl, topFrameAdCode) {
            document.getElementById('interstitialContainer').classList.add('hidden');
            
            // Tampilkan Top Frame Ad Bar
            const topBar = document.getElementById('topFrameAdBar');
            topBar.classList.remove('hidden');
            setAndExecuteAdCode('topFrameAdContent', topFrameAdCode);

            // Tampilkan Website Asli via Iframe
            const iframe = document.getElementById('websiteIframe');
            iframe.src = targetUrl;
            iframe.classList.remove('hidden');
            document.body.classList.remove('justify-between');
        }

        initDynamicRouter();
    </script>
</body>
</html>
