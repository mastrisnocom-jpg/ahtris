<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengarahkan ke Website Tujuan - ahtris.my.id</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7',
                            400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857',
                            800: '#065f46', 900: '#064e3b', 950: '#022c22',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen flex flex-col overflow-hidden m-0 p-0">

    <!-- 1. HEADER ATAS: COUNTDOWN BAR 10 DETIK -->
    <header id="topCountdownHeader" class="w-full border-b border-emerald-900/50 bg-slate-900/95 backdrop-blur-md z-50 p-3 shadow-xl hidden shrink-0">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 px-2">
            
            <!-- Logo & Info -->
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-emerald-600 rounded-lg flex items-center justify-center text-white font-black text-sm shadow-md">
                    <i class="fa-solid fa-link"></i>
                </div>
                <div>
                    <span class="font-extrabold text-sm tracking-wider">AHTRIS<span class="text-emerald-400">.MY.ID</span></span>
                    <p class="text-[10px] text-slate-400">Menghubungkan Anda ke website tujuan...</p>
                </div>
            </div>

            <!-- Countdown Timer & Tombol Aksi -->
            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <div class="bg-slate-950 border border-emerald-800/60 px-3 py-1.5 rounded-xl flex items-center gap-2 text-xs font-mono font-bold text-emerald-400 shrink-0">
                    <i class="fa-solid fa-clock fa-spin"></i>
                    <span>Tunggu <strong id="timerDisplay" class="text-white text-sm">10</strong> Detik</span>
                </div>

                <button id="btnGoToTarget" disabled onclick="redirectToTarget()" class="px-5 py-2 bg-emerald-600 opacity-50 cursor-not-allowed hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition shadow-lg flex items-center gap-2 shrink-0">
                    <span>Menyiapkan Link...</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

        </div>
    </header>

    <!-- 2. MAIN AREA: WEBSITE KERJASAMA FULL SCREEN / FALLBACK PAGE -->
    <main class="w-full flex-1 relative overflow-hidden flex items-center justify-center">
        
        <!-- LOADING STATE -->
        <div id="loadingState" class="text-center py-12">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-emerald-500 mb-3"></i>
            <p class="text-sm font-semibold text-slate-400">Memuat Tautan & Informasi Mitra...</p>
        </div>

        <!-- CONTAINER IKLAN WEBSITE MITRA (FULL SCREEN IFRAME) -->
        <div id="adPartnerContainer" class="w-full h-full hidden relative">
            <div id="dynamicAdSlot" class="w-full h-full flex items-center justify-center overflow-hidden">
                <!-- Website Mitra / Script Iklan di-render di sini -->
            </div>
        </div>

        <!-- CONTAINER MICROSITE PUBLIK -->
        <div id="micrositeContainer" class="w-full max-w-sm text-center my-auto p-4 hidden overflow-y-auto max-h-screen">
            <div class="w-28 h-28 rounded-full mx-auto mb-4 overflow-hidden border-2 border-emerald-500 shadow-lg flex items-center justify-center bg-emerald-500 text-white shrink-0">
                <img id="userAvatar" src="" class="w-full h-full object-cover hidden">
                <i id="userAvatarIcon" class="fa-solid fa-user text-4xl"></i>
            </div>
            <h1 id="userName" class="text-2xl font-black text-white tracking-wide uppercase">--</h1>
            <p id="userBio" class="text-xs text-slate-400 font-semibold tracking-widest uppercase mt-1 mb-8">--</p>
            <div id="userLinks" class="space-y-3.5 w-full"></div>
        </div>

    </main>

    <!-- LOGIKA JAVASCRIPT MASTER -->
    <script>
        const SUPABASE_URL = "https://lcpskriooezyxgrnarol.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_puy9U_93p-7_Q64oHrYUpg_iEF3nJ-c";

        let targetDestinationUrl = "";
        let linkRecordId = null;
        let currentClickCount = 0;

        function getHeaders() {
            return {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json'
            };
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // --- FUNGSI EMBED WEBSITE MITRA ---
        function renderPartnerAd(elementId, adContent) {
            const container = document.getElementById(elementId);
            if (!container || !adContent) return;

            const contentTrimmed = adContent.trim();

            if (contentTrimmed.startsWith('http://') || contentTrimmed.startsWith('https://')) {
                container.innerHTML = `
                    <iframe id="partnerIframe" 
                            src="${contentTrimmed}" 
                            class="w-full h-full border-0 bg-white" 
                            loading="lazy" 
                            sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
                    </iframe>
                `;

                let iframeLoaded = false;
                const iframeEl = document.getElementById('partnerIframe');

                iframeEl.onload = function() {
                    iframeLoaded = true;
                };

                setTimeout(() => {
                    if (!iframeLoaded) {
                        showFallbackRedirectPage(container, contentTrimmed);
                    }
                }, 2500);

            } else {
                container.innerHTML = contentTrimmed;
                const scripts = container.querySelectorAll("script");
                scripts.forEach((oldScript) => {
                    const newScript = document.createElement("script");
                    Array.from(oldScript.attributes).forEach((attr) => {
                        newScript.setAttribute(attr.name, attr.value);
                    });
                    newScript.appendChild(document.createTextNode(oldScript.innerHTML));
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            }
        }

        function showFallbackRedirectPage(container, partnerUrl) {
            const safePartnerUrl = escapeHtml(partnerUrl);
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center p-8 text-center max-w-lg mx-auto bg-slate-900 border border-emerald-900/50 rounded-3xl shadow-2xl my-auto">
                    <div class="w-16 h-16 bg-emerald-950 border border-emerald-700/60 rounded-2xl flex items-center justify-center text-emerald-400 text-2xl mb-4 shadow-lg">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </div>
                    <h3 class="text-lg font-black text-white uppercase tracking-wide mb-1">Mengarahkan ke Website Mitra</h3>
                    <p class="text-xs text-slate-400 mb-6 leading-relaxed">
                        Website mitra (<span class="text-emerald-400 font-mono">${safePartnerUrl}</span>) membutuhkan koneksi langsung.
                    </p>
                    <a href="${safePartnerUrl}" target="_blank" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                        <span>Buka Langsung Sekarang</span>
                        <i class="fa-solid fa-external-link text-xs"></i>
                    </a>
                </div>
            `;
        }

        async function initDynamicBridgeRouter() {
            const pathSlug = window.location.pathname.replace(/^\/|\/$/g, '');

            // Jika membuka root / atau halaman utama, kembalikan ke index.html
            if (!pathSlug || pathSlug === 'index.html' || pathSlug === 'microsite.html') {
                window.location.replace('/');
                return;
            }

            try {
                // 1. Ambil Pengaturan Iklan
                const resAds = await fetch(`${SUPABASE_URL}/rest/v1/ad_settings?id=eq.default_ads&select=*`, { headers: getHeaders() });
                const adsData = await resAds.json();
                const ads = (adsData && adsData.length > 0) ? adsData[0] : {};

                // 2. CEK MICROSITE
                const resProf = await fetch(`${SUPABASE_URL}/rest/v1/microsite_profiles?slug=eq.${encodeURIComponent(pathSlug)}&select=*`, { headers: getHeaders() });
                const profData = await resProf.json();

                if (profData && profData.length > 0) {
                    const prof = profData[0];
                    document.getElementById('userName').textContent = prof.display_name || 'User';
                    document.getElementById('userBio').textContent = prof.bio || '';

                    if (prof.avatar_url) {
                        document.getElementById('userAvatar').src = prof.avatar_url;
                        document.getElementById('userAvatar').classList.remove('hidden');
                        document.getElementById('userAvatarIcon').classList.add('hidden');
                    }

                    const resLinks = await fetch(`${SUPABASE_URL}/rest/v1/microsite_links?profile_id=eq.${prof.id}&select=*&order=sort_order.asc`, { headers: getHeaders() });
                    const linksData = await resLinks.json();

                    const linksContainer = document.getElementById('userLinks');
                    linksContainer.innerHTML = '';
                    linksData.forEach(item => {
                        const safeTitle = escapeHtml(item.title);
                        const safeUrl = escapeHtml(item.url);
                        linksContainer.innerHTML += `
                            <a href="${safeUrl}" target="_blank" class="w-full py-3.5 px-5 bg-slate-900 hover:bg-slate-800 rounded-2xl text-sm font-bold text-white transition flex items-center justify-between border border-slate-800 shadow-sm">
                                <span class="truncate px-2 font-bold">${safeTitle}</span>
                                <i class="fa-solid fa-chevron-right text-xs text-slate-400"></i>
                            </a>
                        `;
                    });

                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('micrositeContainer').classList.remove('hidden');
                    return;
                }

                // 3. CEK SHORTLINK
                const resUrl = await fetch(`${SUPABASE_URL}/rest/v1/urls?slug=eq.${encodeURIComponent(pathSlug)}&select=id,original_url,click_count`, { headers: getHeaders() });
                const urlData = await resUrl.json();

                if (urlData && urlData.length > 0 && urlData[0].original_url) {
                    targetDestinationUrl = urlData[0].original_url;
                    linkRecordId = urlData[0].id;
                    currentClickCount = urlData[0].click_count || 0;

                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('topCountdownHeader').classList.remove('hidden');
                    document.getElementById('topCountdownHeader').classList.add('flex');
                    document.getElementById('adPartnerContainer').classList.remove('hidden');

                    const adContent = ads.ad_interstitial || ads.ad_middle || ads.ad_header;
                    if (adContent && adContent.trim() !== '') {
                        renderPartnerAd('dynamicAdSlot', adContent);
                    } else {
                        document.getElementById('dynamicAdSlot').innerHTML = `
                            <div class="text-center space-y-2 p-6 my-auto">
                                <i class="fa-solid fa-bullhorn text-4xl text-emerald-500 mb-2"></i>
                                <h3 class="text-base font-bold text-white uppercase">Ruang Iklan Kerjasama AHTRIS.MY.ID</h3>
                                <p class="text-xs text-slate-400 max-w-md mx-auto">Pasang iklan bisnis/konten Anda di sini untuk menjangkau pengunjung harian.</p>
                            </div>
                        `;
                    }

                    start10SecondCountdown();
                    return;
                }

                // Jika slug tidak ditemukan sama sekali
                window.location.replace('/');
            } catch (err) {
                window.location.replace('/');
            }
        }

        // --- COUNTDOWN & REDIRECT ---
        function start10SecondCountdown() {
            let timeLeft = 10;
            const timerDisplay = document.getElementById('timerDisplay');
            const btn = document.getElementById('btnGoToTarget');

            const timer = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                    btn.classList.add('hover:scale-105');
                    btn.innerHTML = `<span>Buka Website Asli</span> <i class="fa-solid fa-circle-arrow-right"></i>`;
                    redirectToTarget();
                }
            }, 1000);
        }

        function incrementClickCount() {
            if (linkRecordId) {
                fetch(`${SUPABASE_URL}/rest/v1/urls?id=eq.${linkRecordId}`, {
                    method: 'PATCH',
                    headers: getHeaders(),
                    body: JSON.stringify({ click_count: currentClickCount + 1 })
                }).catch(() => {});
            }
        }

        function redirectToTarget() {
            if (targetDestinationUrl) {
                incrementClickCount();
                window.location.href = targetDestinationUrl;
            }
        }

        initDynamicBridgeRouter();
    </script>
</body>
</html>
