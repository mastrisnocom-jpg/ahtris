<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // Simpan path URL yang dituju ke sessionStorage sebelum dilempar ke index.html
        sessionStorage.setItem('redirect_path', window.location.pathname);
        window.location.href = '/';
    </script>
</head>
<body style="background-color: #0f172a;">
</body>
</html>
