<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsite Builder - ahtris.my.id</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7',
                            400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857',
                            800: '#065f46', 900: '#064e3b', 950: '#022c22',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen font-sans flex flex-col justify-between transition-colors duration-300">

    <!-- Header / Navbar -->
    <header class="w-full border-b border-slate-200 dark:border-emerald-900/40 bg-white/80 dark:bg-slate-900/90 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-2.5">
                <div class="w-9 h-9 bg-emerald-600 rounded-lg flex items-center justify-center text-white font-black text-lg">
                    <i class="fa-solid fa-link"></i>
                </div>
                <span class="font-extrabold tracking-wider">AHTRIS<span class="text-emerald-600 dark:text-emerald-400">.MY.ID</span></span>
            </a>

            <a href="/" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-xs font-bold rounded-xl transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda
            </a>
        </div>
    </header>

    <!-- Content Utama Builder Microsite -->
    <div class="max-w-4xl mx-auto px-4 py-12 w-full flex-1">
        <div class="text-center mb-10">
            <span class="px-3 py-1 bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 text-xs font-semibold rounded-full uppercase tracking-wider">
                Mini Site & Bio Link
            </span>
            <h1 class="text-3xl sm:text-5xl font-black text-slate-900 dark:text-white tracking-tight mt-3">
                Buat Microsite Anda Sendiri
            </h1>
            <p class="text-slate-600 dark:text-slate-300 mt-2 text-sm sm:text-base max-w-xl mx-auto">
                Kumpulkan semua tautan penting Anda dalam satu halaman profil microsite yang menarik dan mudah diakses.
            </p>
        </div>

        <!-- Form Pembuat Microsite -->
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-emerald-900/40 rounded-2xl p-6 sm:p-8 shadow-xl max-w-2xl mx-auto">
            <form id="micrositeForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Nama Profil / Judul Microsite</label>
                    <input type="text" required placeholder="Contoh: Portofolio Ahmad / Bisnis Saya" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Deskripsi Singkat</label>
                    <textarea rows="2" placeholder="Selamat datang di halaman resmi kami..." class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase mb-1">Custom Link URL</label>
                    <div class="flex items-center bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-4 py-3">
                        <span class="text-slate-400 text-sm font-mono mr-1">ahtris.my.id/bio/</span>
                        <input type="text" required placeholder="namamu" class="w-full bg-transparent focus:outline-none font-mono text-sm">
                    </div>
                </div>

                <button type="button" onclick="alert('Fitur pembuatan Microsite instan akan segera aktif!')" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition shadow-lg shadow-emerald-600/30 text-sm">
                    <i class="fa-solid fa-rocket mr-1"></i> Buat Microsite Sekarang
                </button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-emerald-950 bg-white dark:bg-slate-950 py-6 text-center text-xs text-slate-500">
        © 2026 Short Link & Microsite Manager — Supported by PT. Binayasa Putrabatara
    </footer>

</body>
</html>
