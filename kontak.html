<!DOCTYPE html>
<html lang="id">
<head>
<!-- Favicon PNG -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

<!-- Dukungan Tambahan untuk Perangkat Apple (Opsional) -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak Kami - Short Link Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-bold tracking-wider text-teal-400 flex items-center gap-2">
                <i class="fa-solid fa-link text-lg"></i>
                <span>SHORT<span class="text-white">LINK</span></span>
            </a>
            <nav class="flex items-center space-x-6 text-xs font-medium text-slate-300">
                <a href="/" class="hover:text-teal-400 transition">Beranda</a>
                <a href="privacy.html" class="hover:text-teal-400 transition">Privacy Policy</a>
                <a href="kontak.html" class="text-teal-400 font-semibold">Kontak Kami</a>
            </nav>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-3xl mx-auto px-4 py-12 w-full flex-1">
        <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-8 shadow-xl">
            <h1 class="text-3xl font-extrabold text-teal-400 mb-2">Hubungi Kami</h1>
            <p class="text-slate-400 text-sm mb-6">Punya pertanyaan, kendala teknis, atau penawaran kerja sama? Silakan kirimkan pesan Anda melalui formulir di bawah ini.</p>

            <form action="mailto:support@ahtris.my.id" method="post" enctype="text/plain" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nama Lengkap</label>
                    <input type="text" name="Nama" required placeholder="Nama Anda" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-teal-400">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Alamat Email</label>
                    <input type="email" name="Email" required placeholder="email@domain.com" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-teal-400">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Pesan / Masukan</label>
                    <textarea name="Pesan" rows="4" required placeholder="Tuliskan pesan Anda..." class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-teal-400"></textarea>
                </div>
                <button type="submit" class="w-full py-3 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-xl text-sm transition">
                    <i class="fa-solid fa-paper-plane mr-1"></i> Kirim Pesan
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-800">
        © 2026 Short Link Manager. All rights reserved.
    </footer>

</body>
</html>
