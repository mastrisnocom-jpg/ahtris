<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistem Keuangan | Login</title>

  <!-- Google Font: Poppins -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700&display=fallback">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Theme style AdminLTE -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --gold-main: #d4af37;
      --gold-hover: #f3e5ab;
      --bg-dark: #0d0d0d;
      --card-bg: #141414;
      --border-gold: rgba(212, 175, 55, 0.3);
    }

    body.login-page {
      background-color: var(--bg-dark);
      font-family: 'Poppins', sans-serif;
      color: #f5f5f5;
    }

    .login-box {
      width: 400px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-gold);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .login-logo a {
      color: var(--gold-main) !important;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .btn-gold {
      background: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
      color: #000;
      font-weight: 600;
      border: none;
      transition: all 0.3s ease;
    }

    .btn-gold:hover {
      background: linear-gradient(135deg, #f3e5ab 0%, #c59b27 100%);
      color: #000;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
    }

    .form-control {
      background-color: #1c1c1c;
      border: 1px solid #333;
      color: #fff;
    }

    .form-control:focus {
      background-color: #222;
      border-color: var(--gold-main);
      color: #fff;
      box-shadow: none;
    }

    .input-group-text {
      background-color: #1c1c1c;
      border: 1px solid #333;
      color: var(--gold-main);
    }

    a.gold-link {
      color: var(--gold-main);
      text-decoration: none;
    }

    a.gold-link:hover {
      color: var(--gold-hover);
      text-decoration: underline;
    }
  </style>
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo mb-3">
    <a href="#"><i class="fas fa-wallet mr-2"></i><b>FINANCE</b> APP</a>
  </div>

  <div class="card">
    <div class="card-body login-card-body rounded">
      <p class="login-box-msg text-muted" id="formTitle">Silakan masuk ke akun Anda</p>

      <form id="authForm">
        <!-- Input Nama Lengkap (Khusus Mode Daftar) -->
        <div class="input-group mb-3 d-none" id="fullNameGroup">
          <input type="text" class="form-control" id="fullName" placeholder="Nama Lengkap">
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-user"></span></div>
          </div>
        </div>

        <!-- Input Email -->
        <div class="input-group mb-3">
          <input type="email" class="form-control" id="email" placeholder="Email" required>
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-envelope"></span></div>
          </div>
        </div>

        <!-- Input Password -->
        <div class="input-group mb-3">
          <input type="password" class="form-control" id="password" placeholder="Password" required>
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-lock"></span></div>
          </div>
        </div>

        <!-- Pilihan Hak Akses/Role (Khusus Mode Daftar) -->
        <div class="form-group d-none" id="roleGroup">
          <label class="text-xs text-muted">Pilih Hak Akses:</label>
          <select class="form-control" id="roleSelect">
            <option value="Manajemen">Manajemen</option>
            <option value="Administrator">Administrator</option>
          </select>
        </div>

        <div class="row">
          <div class="col-12">
            <button type="submit" class="btn btn-gold btn-block py-2 mb-2" id="submitBtn">Masuk</button>
          </div>
        </div>
      </form>

      <div class="d-flex justify-content-between text-sm mt-3">
        <a href="#" class="gold-link" id="toggleMode">Belum punya akun? Daftar</a>
        <a href="#" class="text-muted" data-toggle="modal" data-target="#forgotPasswordModal">Lupa password?</a>
      </div>

      <div id="alertMessage" class="mt-3 text-center text-sm"></div>
    </div>
  </div>
</div>

<!-- Modal Reset Password -->
<div class="modal fade" id="forgotPasswordModal" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content style-dark" style="background: #141414; border: 1px solid var(--border-gold);">
      <div class="modal-header border-0">
        <h5 class="modal-title" style="color: var(--gold-main);"><i class="fas fa-key mr-2"></i>Reset Password</h5>
        <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body">
        <p class="text-sm text-muted">Masukkan email Anda. Kami akan mengirimkan tautan untuk mengatur ulang password Anda.</p>
        <div class="form-group">
          <input type="email" id="resetEmail" class="form-control" placeholder="Email Anda">
        </div>
        <div id="resetMessage" class="text-sm text-center"></div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-gold btn-block" id="sendResetBtn">Kirim Tautan Reset</button>
      </div>
    </div>
  </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", async () => {
    // 1. Inisialisasi Supabase SDK
    const SUPABASE_URL = "https://lcpskriooezyxgrnarol.supabase.co"; 
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_puy9U_93p-7_Q64oHrYUpg_iEF3nJ-c";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // 2. Cek apakah user sudah login, jika sudah langsung lempar ke index.html
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      window.location.href = 'index.html';
      return;
    }

    // 3. Elemen DOM
    const authForm = document.getElementById('authForm');
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const toggleMode = document.getElementById('toggleMode');
    const fullNameGroup = document.getElementById('fullNameGroup');
    const roleGroup = document.getElementById('roleGroup');
    const alertMessage = document.getElementById('alertMessage');

    let isRegisterMode = false;

    // Toggle Mode Login <-> Register
    toggleMode.addEventListener('click', (e) => {
      e.preventDefault();
      isRegisterMode = !isRegisterMode;
      alertMessage.textContent = '';

      if (isRegisterMode) {
        formTitle.textContent = 'Daftarkan akun baru';
        submitBtn.textContent = 'Daftar Sekarang';
        toggleMode.textContent = 'Sudah punya akun? Masuk';
        fullNameGroup.classList.remove('d-none');
        roleGroup.classList.remove('d-none');
      } else {
        formTitle.textContent = 'Silakan masuk ke akun Anda';
        submitBtn.textContent = 'Masuk';
        toggleMode.textContent = 'Belum punya akun? Daftar';
        fullNameGroup.classList.add('d-none');
        roleGroup.classList.add('d-none');
      }
    });

    // 4. Form Submit Handler (Login / Register)
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value;
      const role = document.getElementById('roleSelect').value;

      alertMessage.className = 'mt-3 text-center text-sm text-warning';
      alertMessage.textContent = 'Memproses...';

      if (isRegisterMode) {
        // --- PROSES DAFTAR ---
        const { data, error } = await supabase.auth.signUp({ email, password });
        
        if (error) {
          alertMessage.className = 'mt-3 text-center text-sm text-danger';
          alertMessage.textContent = error.message;
        } else if (data.user) {
          // Buat record profil di tabel profiles
          const { error: profileError } = await supabase
            .from('profiles')
            .insert([{
              id: data.user.id,
              full_name: fullName || email,
              role: role
            }]);

          if (profileError) {
            console.error("Gagal simpan profil:", profileError.message);
          }

          alertMessage.className = 'mt-3 text-center text-sm text-success';
          alertMessage.textContent = 'Pendaftaran berhasil! Cek email untuk konfirmasi atau silakan login.';
        }
      } else {
        // --- PROSES LOGIN ---
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        
        if (error) {
          alertMessage.className = 'mt-3 text-center text-sm text-danger';
          alertMessage.textContent = 'Gagal Login: ' + error.message;
        } else {
          alertMessage.className = 'mt-3 text-center text-sm text-success';
          alertMessage.textContent = 'Login berhasil! Mengalihkan...';
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        }
      }
    });

    // 5. Handler Lupa Password
    document.getElementById('sendResetBtn').addEventListener('click', async () => {
      const resetEmail = document.getElementById('resetEmail').value;
      const resetMessage = document.getElementById('resetMessage');

      if (!resetEmail) {
        resetMessage.className = 'text-sm text-center text-danger';
        resetMessage.textContent = 'Masukkan email terlebih dahulu!';
        return;
      }

      resetMessage.className = 'text-sm text-center text-warning';
      resetMessage.textContent = 'Mengirim tautan...';

      const { error } = await supabase.auth.resetPasswordForEmail(resetEmail, {
        redirectTo: window.location.origin + '/login.html',
      });

      if (error) {
        resetMessage.className = 'text-sm text-center text-danger';
        resetMessage.textContent = error.message;
      } else {
        resetMessage.className = 'text-sm text-center text-success';
        resetMessage.textContent = 'Instruksi reset password telah dikirim ke email Anda.';
      }
    });
  });
</script>
</body>
</html>
