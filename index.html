<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Under Construction</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 650px;
      width: 100%;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 40px 30px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 15px;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    .badge {
      display: inline-block;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      font-weight: 700;
      color: #ffffff;
    }

    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    /* Jam dan Tanggal Real-time */
    .clock-section {
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 25px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .clock-section span {
      font-weight: 600;
      color: #38bdf8;
    }

    /* Box Hitung Mundur (Countdown) */
    .countdown-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      border-radius: 12px;
      min-width: 75px;
    }

    .time-box .number {
      font-size: 1.8rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .time-box .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #64748b;
      margin-top: 2px;
      letter-spacing: 1px;
    }

    .footer {
      font-size: 0.85rem;
      color: #64748b;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @media (max-width: 480px) {
      .countdown-container {
        gap: 8px;
      }
      .time-box {
        min-width: 60px;
        padding: 10px 8px;
      }
      .time-box .number {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon">🚧</div>
    <div class="badge">Sedang Dalam Perbaikan</div>
    <h1>Website Kami Segera Hadir</h1>
    <p>
      Kami sedang melakukan peningkatan sistem. Peluncuran resmi direncanakan dalam waktu dekat!
    </p>

    <!-- Tanggal & Jam Realtime -->
    <div class="clock-section">
      Waktu Lokal saat ini: <span id="current-datetime">Memuat waktu...</span>
    </div>

    <!-- Countdown Timer (30 Hari) -->
    <div class="countdown-container">
      <div class="time-box">
        <div class="number" id="days">00</div>
        <div class="label">Hari</div>
      </div>
      <div class="time-box">
        <div class="number" id="hours">00</div>
        <div class="label">Jam</div>
      </div>
      <div class="time-box">
        <div class="number" id="minutes">00</div>
        <div class="label">Menit</div>
      </div>
      <div class="time-box">
        <div class="number" id="seconds">00</div>
        <div class="label">Detik</div>
      </div>
    </div>

    <div class="footer">
      &copy; 2026 nama-website.com — Hak Cipta Dilindungi.
    </div>
  </div>

  <script>
    // 1. Logika Jam dan Tanggal Real-time
    function updateClock() {
      const now = new Date();
      const options = { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      };
      document.getElementById('current-datetime').textContent = now.toLocaleDateString('id-ID', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Logika Hitung Mundur 30 Hari
    // Menghitung target 30 hari dari saat pertama kali halaman dibuka
    let targetDate = localStorage.getItem('launchTargetDate');
    
    if (!targetDate) {
      const now = new Date();
      targetDate = new Date(now.getTime() + (30 * 24 * 60 * 60 * 1000)).getTime();
      localStorage.setItem('launchTargetDate', targetDate);
    } else {
      targetDate = parseInt(targetDate, 10);
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.querySelector('.countdown-container').innerHTML = "<h3 style='color:#38bdf8;'>Website Telah Meluncur!</h3>";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>

</body>
</html>
