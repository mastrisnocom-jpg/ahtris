<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase Auth Modal Example</title>

  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    /* --- Top Navigation --- */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
    }

    .nav-btn {
      padding: 8px 16px;
      background-color: #3ecf8e; /* Supabase Green */
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .nav-btn:hover {
      opacity: 0.9;
    }

    .logout-btn {
      background-color: #dc3545;
    }

    /* --- Modal Overlay & Container --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      width: 100%;
      max-width: 380px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 15px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #6c757d;
    }

    /* --- Form Styling --- */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.3rem;
      font-size: 0.9rem;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }

    .submit-btn {
      width: 100%;
      padding: 10px;
      background-color: #3ecf8e;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      margin-top: 0.5rem;
    }

    .toggle-text {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.85rem;
    }

    .toggle-text a {
      color: #3ecf8e;
      text-decoration: none;
      font-weight: bold;
    }

    .toggle-text a:hover {
      text-decoration: underline;
    }

    .message {
      margin-top: 0.8rem;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav>
    <h2>Website Saya</h2>
    <div id="authContainer">
      <button class="nav-btn" id="openAuthBtn">Login / Register</button>
    </div>
  </nav>

  <!-- Content Placeholder -->
  <main style="padding: 2rem; text-align: center;">
    <h1 id="welcomeText">Selamat Datang!</h1>
    <p>Silakan login untuk mengakses fitur lengkap.</p>
  </main>

  <!-- Pop-up Modal Auth -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="close-btn" id="closeModalBtn">&times;</button>
      
      <h2 id="modalTitle" style="margin-bottom: 1.2rem;">Login</h2>

      <form id="authForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Masuk</button>
      </form>

      <div class="toggle-text">
        <span id="toggleQuestion">Belum punya akun?</span>
        <a href="#" id="toggleAuthMode">Daftar sekarang</a>
      </div>

      <div class="message" id="authMessage"></div>
    </div>
  </div>

<script>
  // 1. Inisialisasi Supabase menggunakan Publishable Key Baru
  const SUPABASE_URL = "https://lcpskriooezyxgrnarol.supabase.co"; 
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_puy9U_93p-7_Q64oHrYUpg_iEF3nJ-c";
  
  // Masukkan Publishable Key ke dalam init client
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  // 2. Element DOM
  const modalOverlay = document.getElementById('modalOverlay');
  const openAuthBtn = document.getElementById('openAuthBtn');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const authForm = document.getElementById('authForm');
  const modalTitle = document.getElementById('modalTitle');
  const submitBtn = document.getElementById('submitBtn');
  const toggleAuthMode = document.getElementById('toggleAuthMode');
  const toggleQuestion = document.getElementById('toggleQuestion');
  const authMessage = document.getElementById('authMessage');
  const authContainer = document.getElementById('authContainer');
  const welcomeText = document.getElementById('welcomeText');

  let isSignUp = false;

  // 3. Open & Close Modal Handlers
  openAuthBtn.addEventListener('click', () => modalOverlay.classList.add('active'));
  closeModalBtn.addEventListener('click', closeModal);
  
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  function closeModal() {
    modalOverlay.classList.remove('active');
    authMessage.textContent = '';
    authForm.reset();
  }

  // 4. Toggle Mode (Login <-> Register)
  toggleAuthMode.addEventListener('click', (e) => {
    e.preventDefault();
    isSignUp = !isSignUp;
    authMessage.textContent = '';

    if (isSignUp) {
      modalTitle.textContent = 'Daftar Akun Baru';
      submitBtn.textContent = 'Daftar';
      toggleQuestion.textContent = 'Sudah punya akun?';
      toggleAuthMode.textContent = 'Login di sini';
    } else {
      modalTitle.textContent = 'Login';
      submitBtn.textContent = 'Masuk';
      toggleQuestion.textContent = 'Belum punya akun?';
      toggleAuthMode.textContent = 'Daftar sekarang';
    }
  });

  // 5. Form Submit Handler (Login / Register)
  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    authMessage.style.color = '#333';
    authMessage.textContent = 'Memproses...';

    if (isSignUp) {
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) {
        authMessage.style.color = '#dc3545';
        authMessage.textContent = error.message;
      } else {
        authMessage.style.color = '#198754';
        authMessage.textContent = 'Pendaftaran berhasil! Cek email kamu untuk konfirmasi.';
      }
    } else {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        authMessage.style.color = '#dc3545';
        authMessage.textContent = error.message;
      } else {
        closeModal();
        checkUserSession();
      }
    }
  });

  // 6. Cek & Update Status User
  async function checkUserSession() {
    const { data: { session } } = await supabase.auth.getSession();

    if (session) {
      const userEmail = session.user.email;
      welcomeText.textContent = `Selamat Datang, ${userEmail}!`;
      authContainer.innerHTML = `
        <button class="nav-btn logout-btn" id="logoutBtn">Logout</button>
      `;

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        location.reload();
      });
    }
  }

  checkUserSession();
</script>

</body>
</html>
