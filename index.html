<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Creator Tools Hub</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #022c22;
      --bg-card: rgba(6, 78, 59, 0.4);
      --border-emerald: rgba(16, 185, 129, 0.25);
      --emerald-primary: #10b981;
      --emerald-hover: #059669;
      --emerald-light: #a7f3d0;
      --text-main: #f0fdf4;
      --text-muted: #6ee7b7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #022c22 0%, #064e3b 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header & Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: rgba(2, 44, 34, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-emerald);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--emerald-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-menu {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-badge {
      font-size: 0.8rem;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald-light);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-emerald);
    }

    .btn {
      background: var(--emerald-primary);
      color: #022c22;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    .btn:hover {
      background: var(--emerald-hover);
      color: #ffffff;
    }

    .btn-secondary {
      background: transparent;
      color: var(--emerald-light);
      border: 1px solid var(--border-emerald);
    }

    .btn-secondary:hover {
      background: rgba(16, 185, 129, 0.1);
      border-color: var(--emerald-primary);
    }

    /* Layout Utama */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
      flex-grow: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Lock Screen / Akses Terbatas */
    .protected-screen {
      text-align: center;
      padding: 60px 24px;
      background: rgba(6, 78, 59, 0.3);
      border: 1px solid var(--border-emerald);
      border-radius: 20px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .protected-screen .lock-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }

    .protected-screen h2 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .protected-screen p {
      color: var(--text-muted);
      margin-bottom: 28px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Dashboard Tools */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .tool-card {
      background: var(--bg-card);
      border: 1px solid var(--border-emerald);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      border-color: var(--emerald-primary);
    }

    .tool-icon {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .tool-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .tool-category {
      font-size: 0.75rem;
      color: var(--emerald-light);
      background: rgba(16, 185, 129, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 15px;
    }

    .tool-link-btn {
      text-align: right;
      color: var(--emerald-primary);
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* POP-UP (MODAL) STYLING */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(2, 20, 15, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(8px);
      padding: 20px;
      animation: fadeIn 0.2s ease-out;
    }

    .modal {
      background: #064e3b;
      border: 1px solid var(--border-emerald);
      padding: 32px 28px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #ffffff;
    }

    .modal-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-emerald);
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--emerald-primary);
      border-bottom-color: var(--emerald-primary);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-emerald);
      background: rgba(2, 44, 34, 0.7);
      color: #ffffff;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--emerald-primary);
    }

    .form-submit-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      font-size: 1rem;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border-emerald);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <span>🚀</span> CreatorTools
    </div>
    <div class="user-menu" id="userMenu">
      <button class="btn" onclick="openAuthModal('login')">Login / Daftar</button>
    </div>
  </header>

  <div class="container">

    <!-- Screen Terkunci -->
    <div id="lockedView" class="protected-screen">
      <div class="lock-icon">🔒</div>
      <h2>Akses Terbatas</h2>
      <p>Silakan login terlebih dahulu untuk mengakses kumpulan alat pembuat konten.</p>
      <button class="btn" onclick="openAuthModal('login')">Login Sekarang</button>
    </div>

    <!-- Screen Dashboard -->
    <div id="dashboardView" style="display: none;">
      <div class="dashboard-header">
        <div>
          <h2>Kumpulan Alat Pembuat Konten</h2>
          <p style="color: var(--text-muted);">Pilih alat yang Anda butuhkan untuk mempermudah pekerjaan.</p>
        </div>
        <button id="btnAdminAdd" class="btn" style="display: none;" onclick="openModal('addToolModal')">
          + Tambah Tool Baru
        </button>
      </div>

      <div class="tools-grid" id="toolsContainer">
        <p style="color: var(--text-muted);">Memuat data tool...</p>
      </div>
    </div>

  </div>

  <!-- POP-UP LOGIN / DAFTAR -->
  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('authModal')">&times;</button>
      
      <div class="modal-tabs">
        <button class="tab-btn active" id="tabLogin" onclick="switchAuthTab('login')">Login</button>
        <button class="tab-btn" id="tabRegister" onclick="switchAuthTab('register')">Daftar Akun</button>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="authEmail" placeholder="nama@email.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="authPassword" placeholder="••••••••" />
      </div>

      <button class="btn form-submit-btn" id="btnSubmitAuth" onclick="handleAuth()">
        Masuk
      </button>
    </div>
  </div>

  <!-- POP-UP TAMBAH TOOL -->
  <div class="modal-overlay" id="addToolModal">
    <div class="modal">
      <button class="modal-close" onclick="closeModal('addToolModal')">&times;</button>
      <h3 style="margin-bottom: 20px; color: #fff;">Tambah Tool Baru</h3>
      <div class="form-group">
        <label>Judul Tool</label>
        <input type="text" id="toolTitleInput" placeholder="Contoh: Canva" />
      </div>
      <div class="form-group">
        <label>Link / URL Tool</label>
        <input type="url" id="toolUrlInput" placeholder="https://www.canva.com" />
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <input type="text" id="toolCategoryInput" placeholder="Contoh: Desain, Video, AI" />
      </div>
      <div class="form-group">
        <label>Emoji Icon</label>
        <input type="text" id="toolIconInput" placeholder="🎨" value="🔗" />
      </div>
      <div style="display: flex; gap: 10px; margin-top: 24px;">
        <button class="btn btn-secondary" style="flex: 1;" onclick="closeModal('addToolModal')">Batal</button>
        <button class="btn" style="flex: 1;" onclick="addNewTool()">Simpan</button>
      </div>
    </div>
  </div>

  <footer>
    &copy; 2026 Content Creator Toolkit — Emerald Edition.
  </footer>

  <script>
    const SUPABASE_URL = "https://lcpskriooezyxgrnarol.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjcHNrcmlvb2V6eXhncm5hcm9sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5MDA0ODksImV4cCI6MjEwMDQ3NjQ4OX0.5mdkHtNvDSU_HkGpQfODJ7xE1M-fLioXuqxsY_kaFbA"; 

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let authMode = 'login';
    let currentUser = null;
    let userRole = 'user';

    window.addEventListener('DOMContentLoaded', () => {
      checkAuthState();

      supabase.auth.onAuthStateChange(async (event, session) => {
        if (session) {
          currentUser = session.user;
          await fetchUserRole(currentUser.id);
          renderLoggedInUI();
          loadTools();
        } else {
          currentUser = null;
          renderLoggedOutUI();
        }
      });
    });

    async function checkAuthState() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        currentUser = session.user;
        await fetchUserRole(currentUser.id);
        renderLoggedInUI();
        loadTools();
      } else {
        currentUser = null;
        renderLoggedOutUI();
      }
    }

    async function fetchUserRole(userId) {
      try {
        const { data, error } = await supabase
          .from('profiles')
          .select('role')
          .eq('id', userId)
          .maybeSingle();

        if (data && data.role) {
          userRole = data.role;
        } else {
          userRole = 'user';
        }
      } catch (err) {
        userRole = 'user';
      }
    }

    function renderLoggedInUI() {
      document.getElementById('lockedView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';

      const userMenu = document.getElementById('userMenu');
      userMenu.innerHTML = `
        <span class="user-badge">${currentUser.email} (${userRole})</span>
        <button class="btn btn-secondary" onclick="handleLogout()">Logout</button>
      `;

      if (userRole === 'super_admin') {
        document.getElementById('btnAdminAdd').style.display = 'inline-block';
      } else {
        document.getElementById('btnAdminAdd').style.display = 'none';
      }
    }

    function renderLoggedOutUI() {
      document.getElementById('lockedView').style.display = 'block';
      document.getElementById('dashboardView').style.display = 'none';

      const userMenu = document.getElementById('userMenu');
      userMenu.innerHTML = `
        <button class="btn" onclick="openAuthModal('login')">Login / Daftar</button>
      `;
    }

    async function loadTools() {
      const container = document.getElementById('toolsContainer');
      container.innerHTML = "<p style='color: var(--text-muted);'>Memuat data tool...</p>";

      const { data: tools, error } = await supabase
        .from('tools')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        container.innerHTML = `<p style='color: #f87171;'>Gagal memuat data: ${error.message}</p>`;
        return;
      }

      if (!tools || tools.length === 0) {
        container.innerHTML = "<p style='color: var(--text-muted);'>Belum ada tool yang ditambahkan.</p>";
        return;
      }

      container.innerHTML = tools.map(tool => `
        <a href="${tool.url}" target="_blank" class="tool-card">
          <div>
            <div class="tool-icon">${tool.icon || '🔗'}</div>
            <div class="tool-title">${tool.title}</div>
            <span class="tool-category">${tool.category || 'Umum'}</span>
          </div>
          <div class="tool-link-btn">Buka Tool ↗</div>
        </a>
      `).join('');
    }

    async function addNewTool() {
      const title = document.getElementById('toolTitleInput').value.trim();
      const url = document.getElementById('toolUrlInput').value.trim();
      const category = document.getElementById('toolCategoryInput').value.trim() || 'Umum';
      const icon = document.getElementById('toolIconInput').value.trim() || '🔗';

      if (!title || !url) {
        alert('Judul dan Link Tool wajib diisi!');
        return;
      }

      const { error } = await supabase
        .from('tools')
        .insert([{ title, url, category, icon }]);

      if (error) {
        alert('Gagal menambah tool: ' + error.message);
      } else {
        alert('Tool berhasil ditambahkan!');
        closeModal('addToolModal');
        document.getElementById('toolTitleInput').value = '';
        document.getElementById('toolUrlInput').value = '';
        loadTools();
      }
    }

    async function handleAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const submitBtn = document.getElementById('btnSubmitAuth');

      if (!email || !password) {
        alert('Silakan isi email dan password!');
        return;
      }

      if (password.length < 6) {
        alert('Password minimal terdiri dari 6 karakter!');
        return;
      }

      submitBtn.innerText = 'Memproses...';
      submitBtn.disabled = true;

      try {
        if (authMode === 'register') {
          const { data: signUpData, error: signUpError } = await supabase.auth.signUp({ email, password });
          
          if (signUpError) {
            alert('Gagal Daftar: ' + signUpError.message);
          } else {
            const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
            if (signInError) {
              alert('Pendaftaran berhasil! Silakan pindah ke tab Login untuk masuk.');
              switchAuthTab('login');
            } else {
              alert('Pendaftaran Berhasil! Selamat datang.');
              closeModal('authModal');
            }
          }
        } else {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) {
            alert('Login Gagal: ' + error.message);
          } else {
            closeModal('authModal');
          }
        }
      } catch (err) {
        alert('Terjadi kesalahan: ' + err.message);
      } finally {
        submitBtn.innerText = authMode === 'register' ? 'Buat Akun' : 'Masuk';
        submitBtn.disabled = false;
      }
    }

    async function handleLogout() {
      await supabase.auth.signOut();
    }

    function openAuthModal(mode = 'login') {
      switchAuthTab(mode);
      openModal('authModal');
    }

    function switchAuthTab(mode) {
      authMode = mode;
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const submitBtn = document.getElementById('btnSubmitAuth');

      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        submitBtn.innerText = 'Masuk';
      } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        submitBtn.innerText = 'Buat Akun';
      }
    }

    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }
  </script>

</body>
</html>
