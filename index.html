<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Link Manager - Supabase</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex flex-col justify-between selection:bg-teal-300 selection:text-teal-900">

    <!-- Container Utama -->
    <div class="max-w-3xl mx-auto px-4 py-12 w-full">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-teal-400 tracking-tight">Short Link Database</h1>
            <p class="text-slate-400 mt-2">Buat link pendek kustom dengan domain <span class="text-teal-300 font-semibold" id="displayDomain">...</span></p>
        </div>

        <!-- Form Pembuat Link -->
        <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-6 shadow-xl mb-10">
            <form id="shortenForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">URL Original</label>
                    <input type="url" id="originalUrl" required placeholder="https://example.com/halaman-sangat-panjang" 
                           class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:border-teal-400 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Custom Slug (Opsional)</label>
                    <div class="flex items-center bg-slate-900 border border-slate-700 rounded-xl overflow-hidden focus-within:border-teal-400 transition">
                        <span class="pl-4 pr-1 text-slate-500 text-sm font-mono" id="domainPrefix">.../</span>
                        <input type="text" id="customSlug" placeholder="hasilshort" 
                               class="w-full py-3 pr-4 bg-transparent text-slate-100 focus:outline-none font-mono text-sm">
                    </div>
                </div>
                <button type="submit" id="btnSubmit" 
                        class="w-full py-3 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-xl transition duration-200 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-link"></i> Pendekkan URL
                </button>
            </form>
            <div id="statusMessage" class="mt-4 text-center text-sm font-medium hidden"></div>
        </div>

        <!-- Tabel Daftar Link -->
        <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h2 class="text-xl font-bold text-white">Daftar Short Link</h2>
                <button onclick="loadUrls()" class="text-xs text-slate-400 hover:text-teal-400 transition flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> Refresh
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="text-xs uppercase bg-slate-900/50 text-slate-400">
                        <tr>
                            <th class="p-3 rounded-l-lg">Short Link</th>
                            <th class="p-3">URL Asli</th>
                            <th class="p-3 text-center">Klik</th>
                            <th class="p-3 text-right rounded-r-lg">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="urlTableBody" class="divide-y divide-slate-700/50">
                        <!-- Data URL muncul di sini -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-800">
        Database Powered by Supabase & Hosted on GitHub Pages
    </footer>

    <!-- Script Logika -->
    <script>
        // Konfigurasi Supabase
        const SUPABASE_URL = "https://lcpskriooezyxgrnarol.supabase.co"; 
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_puy9U_93p-7_Q64oHrYUpg_iEF3nJ-c";
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        const form = document.getElementById('shortenForm');
        const originalUrlInput = document.getElementById('originalUrl');
        const customSlugInput = document.getElementById('customSlug');
        const statusMessage = document.getElementById('statusMessage');
        const urlTableBody = document.getElementById('urlTableBody');

        const currentOrigin = window.location.origin;
        document.getElementById('domainPrefix').textContent = `${window.location.host}/`;
        document.getElementById('displayDomain').textContent = window.location.host;

        // ----------------------------------------------------
        // 1. LOGIKA REDIRECT BERBASIS PATH (GITHUB PAGES READY)
        // ----------------------------------------------------
        async function handleRedirect() {
            // Cek path dari 404.html atau dari URL langsung
            let redirectPath = sessionStorage.getItem('redirect_path');
            sessionStorage.removeItem('redirect_path'); // Hapus memori sementara

            let pathSlug = '';

            if (redirectPath) {
                pathSlug = redirectPath.replace(/^\/|\/$/g, '');
            } else {
                pathSlug = window.location.pathname.replace(/^\/|\/$/g, '');
            }

            // Jika ada slug dan bukan file index.html
            if (pathSlug && pathSlug !== 'index.html') {
                // Tampilkan URL bersih di browser tanpa reload
                window.history.replaceState(null, null, '/' + pathSlug);

                document.body.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white">
                        <div class="text-center">
                            <i class="fa-solid fa-spinner fa-spin text-4xl text-teal-400 mb-4"></i>
                            <h1 class="text-2xl font-bold mb-2">Mengalihkan Halaman...</h1>
                            <p class="text-slate-400">Harap tunggu sebentar.</p>
                        </div>
                    </div>
                `;

                // Cari URL Asli di Supabase
                const { data, error } = await supabase
                    .from('urls')
                    .select('original_url')
                    .eq('slug', pathSlug)
                    .single();

                if (data && data.original_url) {
                    // Update jumlah klik di database
                    await supabase.rpc('increment_click_count', { target_slug: pathSlug });
                    
                    // Alihkan ke link tujuan
                    window.location.href = data.original_url;
                } else {
                    document.body.innerHTML = `
                        <div class="min-h-screen flex items-center justify-center bg-slate-900 text-white p-4">
                            <div class="text-center max-w-md">
                                <i class="fa-solid fa-circle-exclamation text-5xl text-red-400 mb-4"></i>
                                <h1 class="text-3xl font-bold text-white mb-2">404 - Tidak Ditemukan</h1>
                                <p class="text-slate-400 mb-6">Short link <span class="text-teal-400 font-mono">/${pathSlug}</span> tidak terdaftar di database.</p>
                                <a href="${currentOrigin}" class="px-5 py-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-sm text-teal-400 font-semibold transition">
                                    Kembali ke Beranda
                                </a>
                            </div>
                        </div>
                    `;
                }
                return true;
            }
            return false;
        }

        // ----------------------------------------------------
        // 2. FUNGSI MEMBUAT SHORT LINK BARU
        // ----------------------------------------------------
        function generateRandomSlug(length = 6) {
            const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const original_url = originalUrlInput.value.trim();
            let slug = customSlugInput.value.trim().replace(/^\/|\/$/g, '');

            if (!slug) {
                slug = generateRandomSlug();
            }

            showStatus("Memproses...", "text-slate-400");

            const { data, error } = await supabase
                .from('urls')
                .insert([{ original_url, slug }])
                .select();

            if (error) {
                if (error.code === '23505') {
                    showStatus("Slug/kode tersebut sudah digunakan! Silakan pilih kode lain.", "text-red-400");
                } else {
                    showStatus("Gagal membuat link: " + error.message, "text-red-400");
                }
            } else {
                showStatus("Short link berhasil dibuat!", "text-teal-400");
                form.reset();
                loadUrls();
            }
        });

        function showStatus(msg, colorClass) {
            statusMessage.textContent = msg;
            statusMessage.className = `mt-4 text-center text-sm font-medium ${colorClass}`;
            statusMessage.classList.remove('hidden');
        }

        // ----------------------------------------------------
        // 3. FUNGSI MEMUAT DAFTAR LINK
        // ----------------------------------------------------
        async function loadUrls() {
            const { data, error } = await supabase
                .from('urls')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Error loading URLs:", error);
                return;
            }

            urlTableBody.innerHTML = '';

            if (data.length === 0) {
                urlTableBody.innerHTML = `
                    <tr>
                        <td colspan="4" class="p-4 text-center text-slate-500">Belum ada short link yang dibuat.</td>
                    </tr>
                `;
                return;
            }

            data.forEach(item => {
                const fullShortUrl = `${currentOrigin}/${item.slug}`;
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-700/30 transition";

                row.innerHTML = `
                    <td class="p-3 font-mono text-teal-400 font-medium">
                        <a href="${fullShortUrl}" target="_blank" class="hover:underline">/${item.slug}</a>
                    </td>
                    <td class="p-3 truncate max-w-xs text-slate-400" title="${item.original_url}">
                        ${item.original_url}
                    </td>
                    <td class="p-3 text-center font-bold text-slate-200">
                        ${item.click_count}
                    </td>
                    <td class="p-3 text-right">
                        <button onclick="copyToClipboard('${fullShortUrl}')" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 rounded-lg transition inline-flex items-center gap-1">
                            <i class="fa-regular fa-copy"></i> Salin
                        </button>
                    </td>
                `;
                urlTableBody.appendChild(row);
            });
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert("Short URL berhasil disalin!");
        }

        // Jalankan pengecekan redirect saat halaman pertama dimuat
        handleRedirect().then((isRedirecting) => {
            if (!isRedirecting) {
                loadUrls();
            }
        });
    </script>
</body>
</html>
